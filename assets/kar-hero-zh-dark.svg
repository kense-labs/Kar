<svg xmlns="http://www.w3.org/2000/svg" width="760" height="178" viewBox="0 0 760 178" role="img" aria-labelledby="title desc">
  <title id="title">Kar 的会话与存储</title>
  <desc id="desc">客户端向 Kar 提交一轮消息。Kar 与原生运行时通信，将提问、工具调用和回复写入本地日志。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#88867C" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="177" rx="14" fill="#191918" stroke="#45443F"/>
  <g fill="#252522" stroke="#45443F">
    <rect x="24.5" y="22.5" width="182" height="67" rx="9"/>
    <rect x="552.5" y="22.5" width="183" height="67" rx="9"/>
  </g>
  <rect x="281" y="22" width="198" height="68" rx="9" fill="#E2B28D"/>
  <g fill="none" stroke="#88867C" stroke-width="1.5">
    <path d="M216 56h55" marker-start="url(#tip)" marker-end="url(#tip)"/>
    <path d="M489 56h54" marker-start="url(#tip)" marker-end="url(#tip)"/>
    <path d="M380 91v23" marker-end="url(#tip)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" text-anchor="middle">
    <g fill="#B8B6AA" font-size="13">
      <text x="115" y="48">客户端</text>
      <text x="644" y="48">智能体运行时</text>
    </g>
    <g fill="#F2F1EB" font-size="18" font-weight="600">
      <text x="115" y="73">CLI · Kwrok</text>
      <text x="644" y="73">Codex · Claude</text>
    </g>
    <text x="380" y="53" fill="#2B2019" font-size="23" font-weight="650">Kar</text>
    <text x="380" y="74" fill="#2B2019" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">ChatSession</text>
    <text x="380" y="137" fill="#F2F1EB" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="600">.karchat</text>
    <text x="380" y="159" fill="#B8B6AA" font-size="13">提问、工具调用、回复</text>
  </g>
</svg>
