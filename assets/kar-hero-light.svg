<svg xmlns="http://www.w3.org/2000/svg" width="760" height="178" viewBox="0 0 760 178" role="img" aria-labelledby="title desc">
  <title id="title">Sessions and storage in Kar</title>
  <desc id="desc">A client submits a turn to Kar. Kar communicates with the native runtime and saves prompts, tool calls and replies in a local journal.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#8B867A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="177" rx="14" fill="#F7F6F2" stroke="#D9D6CC"/>
  <g fill="#FFFEFB" stroke="#D9D6CC">
    <rect x="24.5" y="22.5" width="182" height="67" rx="9"/>
    <rect x="552.5" y="22.5" width="183" height="67" rx="9"/>
  </g>
  <rect x="281" y="22" width="198" height="68" rx="9" fill="#343029"/>
  <g fill="none" stroke="#8B867A" stroke-width="1.5">
    <path d="M216 56h55" marker-start="url(#tip)" marker-end="url(#tip)"/>
    <path d="M489 56h54" marker-start="url(#tip)" marker-end="url(#tip)"/>
    <path d="M380 91v23" marker-end="url(#tip)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" text-anchor="middle">
    <g fill="#615E55" font-size="13">
      <text x="115" y="48">Client</text>
      <text x="644" y="48">Agent runtime</text>
    </g>
    <g fill="#292823" font-size="18" font-weight="600">
      <text x="115" y="73">CLI · Kwrok</text>
      <text x="644" y="73">Codex · Claude</text>
    </g>
    <text x="380" y="53" fill="#F8E9D9" font-size="23" font-weight="650">Kar</text>
    <text x="380" y="74" fill="#F8E9D9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">ChatSession</text>
    <text x="380" y="137" fill="#292823" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="600">.karchat</text>
    <text x="380" y="159" fill="#615E55" font-size="13">prompts, tool calls, replies</text>
  </g>
</svg>
