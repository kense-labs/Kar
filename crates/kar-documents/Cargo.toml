[package]
name = "kar-documents"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
docs_engine = { git = "https://github.com/kense-labs/kantor", rev = "9b780379e32d3fa4d293499f33fbc2483655567d" }

sheets_engine = { git = "https://github.com/kense-labs/kantor", rev = "9b780379e32d3fa4d293499f33fbc2483655567d" }
slides_engine = { git = "https://github.com/kense-labs/kantor", rev = "9b780379e32d3fa4d293499f33fbc2483655567d" }
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
ironcalc = { git = "https://github.com/kense-labs/kantor", rev = "9b780379e32d3fa4d293499f33fbc2483655567d" }
ironcalc_base = { git = "https://github.com/kense-labs/kantor", rev = "9b780379e32d3fa4d293499f33fbc2483655567d" }

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
