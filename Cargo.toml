[package]
name = "kar"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Rust-native control and observation of coding agent runtimes"
license = "Apache-2.0"
default-run = "kar"

[lib]
name = "kar"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "kar"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
uuid = { version = "1", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
subtle = "2"
tokio-util = "0.7"
portable-pty = "0.9"
vt100 = "0.16"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
icu_collator = "2"
indexmap = { version = "2", features = ["serde"] }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio", "query"] }
gix = { version = "0.75", default-features = false, features = ["tree-editor", "excludes"] }
ignore = "0.4"
base64 = "0.22"
aes-gcm = { version = "0.10", features = ["zeroize"] }
sha2 = "0.10"
zeroize = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
eventsource-stream = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
semver = "1"
percent-encoding = "2"
jiff = { version = "0.2", default-features = false, features = ["std"] }
toml = { version = "0.9", default-features = false, features = ["parse", "std", "serde"] }
json_comments = "0.2"

[[test]]
name = "protocol"
path = "tests/protocol.rs"
harness = false

[[test]]
name = "chat_restart"
path = "tests/chat_restart.rs"
harness = false

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "feature", "fs", "user"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.15"

[target."cfg(windows)".dependencies]
process-wrap = { version = "8.2.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "http1", "http2", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["test-util"] }
prost = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["term"] }

[[test]]
name = "claude_reset"
path = "tests/claude_reset.rs"
harness = false

[[test]]
name = "acp_deadlines"
path = "tests/acp_deadlines.rs"
harness = false
