# Kar 两阶段后端源码差异清单
version = 1
runtime_commit = "2b15859a13dcc50e8b66cbaee5a007832aa00e08"
workbench_commit = "2808e878de91aacc7fb82887f18414976be7ae34"
initial_kar_comparison = "deb7091eaccefacef2221a0489d7b73499cfe24e"
runtime_inventory = "backend-source-index.tsv"
workbench_rpc_inventory = "backend-workbench-source-index.tsv"
sdk_member_mapping = "backend-sdk-map.tsv"
workbench_command_mapping = "backend-workbench-command-map.tsv"
workbench_http_mapping = "backend-workbench-http-map.tsv"
workbench_mcp_mapping = "backend-workbench-mcp-map.tsv"
forge_driver_mapping = "backend-workbench-forge-source-map.tsv"
path_convention = "upstream 路径相对相应固定提交的仓库根；sdk: 相对运行时发布包根目录，由导出 ./agents 且含 src/contracts 的包定位。kar 路径相对 Kar 仓库根。"

[process]
scope = "覆盖两个固定提交公开、可调用的后端能力。保留第一阶段原 12 项、第二阶段原 8 项，以及 Kar 自有的 Kantor 人机双写要求。GPUI 绘制在本轮范围之外，供界面调用的后端仍须核对。"
audit = "逐行检查运行时索引中的 CLI、包导出、契约、公共用例与供应商断言；工作台按 RPC 索引逐行沿服务端注册追到真实实现、权限、持久化和版本对应的驱动。继续展开复合入口的子命令，以及独立的 HTTP、MCP、订阅、后台任务、服务与原生驱动入口。新发现的公开操作、不同语义或仅有部分实现的操作立即追加为清单项，写明出处、Kar 入口及独立可观察的验收条件。"
implementation = "先检查当前主线及在途改动，复用已等价的 Kar 入口。参照固定源码中的分支、参数、默认值、返回、错误和副作用，用纯 Rust 补齐 Kar 自有逻辑；沿用供应商原生协议和系统程序。Kar 命名及已明确取消旧格式兼容的要求继续生效。"
tracking = "每个源码入口登记 Kar 的等价入口或待补条目。对部分实现，列出具体缺失的子操作；对只属前端绘制或其他不适用项写明依据。对应条目的实现提交、实际测试名、复验命令及证据需可回溯。源索引行数只表示盘点范围。"
validation = "开发时写好测试入口，只做必要的 macOS 编译和接口检查。全部可实现功能合入后，在同一 macOS 候选提交统一执行两阶段适用用例、跨模块场景及全量回归。运行时、工作台和第三方远端分别记录真实观察。缺账号、设备、部署与供应商确实不支持的行为分开列；Linux 后移，Windows 实机按原清单排除。"
closure = "所有适用的公开后端入口及其子操作均有去向，所有查实缺口已有 Kar 实现和复验入口，最终报告逐项引用同一候选提交的实测或明确的外部限制。按功能、驱动和版本核销。验收发现 Kar 自身缺口时重新打开对应项，修复并对最终候选重验。"

# 定向命令是集中验收时的用例归属。开发者需在相应目标中补入具名用例并登记，运行时检查命中数。
# 以下是已定位到源码的工作项。status 表示开发处置，验收结果单独登记。

