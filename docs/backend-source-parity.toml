forge_driver_mapping = "backend-workbench-forge-source-map.tsv"
path_convention = "upstream 路径相对相应固定提交的仓库根；sdk: 相对运行时发布包根目录，由导出 ./agents 且含 src/contracts 的包定位。kar 路径相对 Kar 仓库根。"

[process]
scope = "本轮交付范围由 backend-acceptance.toml 的 12 项和 backend-workbench-acceptance.toml 的 8 项确定，含两文件明确列出的公共用例、供应商断言、综合场景与 Kantor 双写。"
audit = "从清单中的用户操作出发。用固定源码澄清公开行为；发现 Kar 的缺口时记录对应场景 ID、受影响的操作、期望和正常入口。"
implementation = "从 Kar 的现有 CLI、SDK 或服务入口完成场景。采用纯 Rust，可独立设计模块、命令、存储格式和协议映射。优先修复会改变用户结果的差异。"
tracking = "以下条目与 RPC、HTTP、MCP 和源码索引保留为查阅资料。只有能指出两份清单中受影响操作的条目才进入本轮开发与验收，内部实现差异单独留存。"
validation = "开发时写好测试入口，只做必要的 macOS 编译和接口检查。全部可实现功能合入后，在同一 macOS 候选提交统一执行两阶段适用用例、跨模块场景及全量回归。运行时、工作台和第三方远端分别记录真实观察。缺账号、设备、部署与供应商确实不支持的行为分开列；Linux 后移，Windows 实机按原清单排除。"
closure = "以两份原清单的适用场景在同一 macOS 候选提交上的实际结果收尾。供应商限制与环境缺失分别记录，保留对应证据与复验入口。"

# 定向命令是集中验收时的用例归属。开发者需在相应目标中补入具名用例并登记，运行时检查命中数。
# 以下是已定位到源码的工作项。status 表示开发处置，验收结果单独登记。

