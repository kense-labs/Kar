# Kar 两阶段后端源码差异清单
version = 1
runtime_commit = "2b15859a13dcc50e8b66cbaee5a007832aa00e08"
workbench_commit = "2808e878de91aacc7fb82887f18414976be7ae34"
initial_kar_comparison = "deb7091eaccefacef2221a0489d7b73499cfe24e"
runtime_inventory = "backend-source-index.tsv"
workbench_rpc_inventory = "backend-workbench-source-index.tsv"
path_convention = "upstream 路径相对相应固定提交的仓库根；sdk: 相对运行时发布包根目录，由导出 ./agents 且含 src/contracts 的包定位。kar 路径相对 Kar 仓库根。"

[process]
scope = "覆盖两个固定提交公开、可调用的后端能力。保留第一阶段原 12 项、第二阶段原 8 项，以及 Kar 自有的 Kantor 人机双写要求。GPUI 绘制在本轮范围之外，供界面调用的后端仍须核对。"
audit = "逐行检查运行时索引中的 CLI、包导出、契约、公共用例与供应商断言；工作台按 RPC 索引逐行沿服务端注册追到真实实现、权限、持久化和版本对应的驱动。继续展开复合入口的子命令，以及独立的 HTTP、MCP、订阅、后台任务、服务与原生驱动入口。新发现的公开操作、不同语义或仅有部分实现的操作立即追加为清单项，写明出处、Kar 入口及独立可观察的验收条件。"
implementation = "先检查当前主线及在途改动，复用已等价的 Kar 入口。参照固定源码中的分支、参数、默认值、返回、错误和副作用，用纯 Rust 补齐 Kar 自有逻辑；沿用供应商原生协议和系统程序。Kar 命名及已明确取消旧格式兼容的要求继续生效。"
tracking = "每个源码入口登记 Kar 的等价入口或待补条目。对部分实现，列出具体缺失的子操作；对只属前端绘制或其他不适用项写明依据。对应条目的实现提交、实际测试名、复验命令及证据需可回溯。源索引行数只表示盘点范围。"
validation = "开发时写好测试入口，只做必要的 macOS 编译和接口检查。全部可实现功能合入后，在同一 macOS 候选提交统一执行两阶段适用用例、跨模块场景及全量回归。运行时、工作台和第三方远端分别记录真实观察。缺账号、设备、部署与供应商确实不支持的行为分开列；Linux 后移，Windows 实机按原清单排除。"
closure = "所有适用的公开后端入口及其子操作均有去向，所有查实缺口已有 Kar 实现和复验入口，最终报告逐项引用同一候选提交的实测或明确的外部限制。按功能、驱动和版本核销。验收发现 Kar 自身缺口时重新打开对应项，修复并对最终候选重验。"

# 定向命令是集中验收时的用例归属。开发者需在相应目标中补入具名用例并登记，运行时检查命中数。
# 以下是已定位到源码的工作项。status 表示开发处置，验收结果单独登记。

[[gap]]
id = "agent-followup"
phase = 1
name = "子任务默认追加指令"
upstream = ["sdk:src/agents/subagent.ts","packages/cli/src/mcp-tools.ts"]
kar = ["src/agents.rs","src/mcp.rs"]
status = "待补齐或对照现有实现核销"
test_target = "cargo test --locked --test protocol"
accept = "用同一个子任务分别处于空闲、忙碌可插话、忙碌只可排队时调用默认 send；比较原生请求、落点和次数。再令会话在状态读取后变忙，核对回退与拒绝原因。显式 steer、queue 的语义按源码分别验证。"

[[gap]]
id = "agent-capacity"
phase = 1
name = "按正在运行的子任务限制并发"
upstream = ["sdk:src/agents/crew.ts","sdk:src/agents/subagent.ts","sdk:src/agents/types.ts"]
kar = ["src/agents.rs"]
status = "已集成活动回合限额，待统一验收"
implementation_ref = "739d0b3"
test_target = "cargo test --locked --test protocol"
accept = "设上限为 1。A 忙时启动 B 应被拒绝；A 结束但保留会话后，B 能启动。B 忙时重新向空闲 A 发起新回合，检查限额与回执；B 结束后 A 可在原会话继续。"

[[gap]]
id = "agent-options"
phase = 1
name = "在 MCP 的 run 和 spawn 中按子任务配置启动参数"
upstream = ["packages/cli/src/mcp-tools.ts","sdk:src/agents/types.ts"]
kar = ["src/mcp.rs","src/agents.rs"]
status = "待补齐或对照现有实现核销"
test_target = "cargo test --locked --test protocol"
accept = "给两个子任务指定不同工作目录、模型、推理强度及服务档位，同时检查省略参数的默认值。从供应商握手、实际请求或原生读回确认归属，核对无效参数的拒绝，不将一方设置传给另一方。"

[[gap]]
id = "agent-depth"
phase = 1
name = "子任务嵌套深度和可用运行时选择"
upstream = ["packages/cli/src/mcp-command.ts","packages/cli/src/mcp-tools.ts","sdk:src/agents/crew.ts"]
kar = ["src/main.rs","src/mcp.rs"]
status = "嵌套深度已集成，运行时允许列表及默认值待对照"
implementation_ref = "739d0b3"
test_target = "cargo test --locked --test protocol"
accept = "分别使用默认深度和显式深度 2 逐层委派，最后一层返回规定的拒绝。对默认运行时集合及显式允许列表分别查询和启动，核对实际可派生的运行时及拒绝原因。"

[[gap]]
id = "agent-records"
phase = 1
name = "MCP 子任务按会话保存记录"
upstream = ["packages/cli/src/mcp-command.ts","sdk:src/agents/crew.ts","sdk:src/agents/subagent.ts"]
kar = ["src/mcp.rs","src/agents.rs","src/voyage.rs"]
status = "子任务记录已集成，待统一验收"
implementation_ref = "739d0b3"
test_target = "cargo test --locked --test protocol"
accept = "配置独立日志目录，并行运行两个子任务。服务退出后用 Kar 原生记录读取器复查会话、回合与终态，校验文件归属；再检查未配置目录时的行为。采用 Kar 当前记录格式。"

[[gap]]
id = "models-all"
phase = 1
name = "从 CLI 聚合已安装运行时的模型、指定工作区及单运行时超时"
upstream = ["packages/cli/src/index.ts","packages/cli/src/models.ts","packages/cli/src/each-runtime.ts"]
kar = ["src/main.rs","src/inventory/mod.rs"]
status = "批量查询与超时已有实现，显式 all、输出和失败退出语义待对照"
implementation_ref = "98f4895"
test_target = "cargo test --locked --test setup_cli"
accept = "分别省略运行时、选择全部、指定单一运行时；设置项目目录、不同原生模型目录和单运行时超时，混入缺程序、查询超时和查询成功的情形。比较逐项结果、错误归属、输出模式和进程退出码。先核对主线已有模型查询改动。"

[[gap]]
id = "inventory-all"
phase = 1
name = "在同一 CLI 查询中按工作区汇总各运行时原生清单"
upstream = ["packages/cli/src/index.ts","packages/cli/src/each-runtime.ts"]
kar = ["src/main.rs","src/inventory/mod.rs"]
status = "四种批量清单入口已有实现，逐项输出和失败退出语义待对照"
implementation_ref = "f4a54ae"
test_target = "cargo test --locked --test setup_cli"
accept = "分别查询技能、命令、MCP 服务器和工具。用两个可区分的运行时及一个缺失的程序，覆盖单个与全部查询、项目目录和超时，核对每行安装状态、清单归属及失败退出语义。"

[[gap]]
