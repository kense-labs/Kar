# Kar 工作台后端 · 第二阶段验收清单
phase = 2
runtime_checklist = "backend-acceptance.toml"
start_when = "两个阶段并行开发。独立模块直接按固定契约实现，涉及共享接口的模块在接口稳定后集成。两阶段功能集成后统一执行验收场景。"
baseline_commit = "2808e878de91aacc7fb82887f18414976be7ae34"
scope = "前七项以固定提交中的服务行为为对照。第八项覆盖文本与 Markdown 双写，以及通过 Kantor 文档引擎进行的 Word 段落、Excel 单元格和 PPT 对象双写。GPUI 前端另期安排。"
implementation = "Kar 自有服务、协议适配、持久化、任务执行和 API 均用 Rust。通过协议接入供应商原生程序、系统 shell、Git、浏览器和外部服务。"
platforms = "本轮以 macOS 为开发、集成和最终统一验收平台。Linux 专项适配、构建和验证后移，保留之前的证据。Windows 实机仍排除。"

[evidence]
per_case = ["能力与用例", "Kar 提交与参考契约", "平台及依赖版本", "初始状态和输入", "预期与实测结果", "可重跑的命令、测试名及证据", "状态"]
states = ["已验收", "未完成或失败", "供应商不支持", "缺环境待验证", "Linux 平台后移", "Windows 实机排除"]
rules = "验收通过要求从正常服务入口执行并观察持久状态。供应商限制附对应版本的依据。缺环境项写明所缺账号、部署或设备，附本地替代验证和补验方法。各自记录协议测试和真实联调结果。"
test_entry = "开发时编写用例并登记实际的测试入口、平台与复验命令，仅做必要的编译检查。待两阶段功能全部集成，在同一候选提交集中执行单项、跨模块、实机和全量回归，并记录实际执行的用例名、数量与结果。"

[estimate]
unit = "单个 Codex 主线程连续开发的小时数，每项含实现与定向回归。"
assumptions = "复用第一阶段已验收的会话、游标、检查点、供应商控制和 HTTP 基础。第八项含文本双写、三个 Kantor 引擎的无界面适配、并发合并及文件往返回归。外部环境等待和 GPUI 前端另计。"
final_integration_hours = [24, 56]
total_hours = [464, 960]
main_uncertainty = "代码托管平台各自支持的操作、原生运行时交接差异，以及跨设备授权和隧道的真实联调。"

[[items]]
id = "projects"
name = "统一项目、聊天与工作区服务"
hours = [32, 64]
reference = ["packages/contracts/src/rpc.ts", "apps/server/src/project/ProjectService.ts", "apps/server/src/workspace/WorkspaceFileSystem.ts", "apps/server/src/workspace/WorkspaceSearchIndex.ts", "apps/server/src/orchestration-v2/ThreadSearch.ts"]
test_command = "cargo test --locked --test workbench_projects"
accept = [
  "创建两个含同名文件的项目，各建两个聊天。两个客户端经同一服务列出项目、打开聊天、发消息和重新订阅，核对项目和聊天 ID、消息归属及重连游标。",
  "写入带已知关键词的文件和消息，分别执行项目文件名搜索、内容搜索和跨聊天搜索。结果须定位到正确的文件、消息及聊天，按请求作用域返回；普通工作区文件可经 API 读取和保存，越过授权目录的请求被拒绝。",
  "归档和重新打开适用的聊天；重启服务并从第二个客户端重查项目、绑定、聊天状态、搜索结果和待收事件，与重启前的持久状态核对。"
]

[[items]]
id = "git"
name = "Git 仓库与独立工作树"
hours = [40, 80]
reference = ["packages/contracts/src/git.ts", "apps/server/src/git/GitWorkflowService.ts", "apps/server/src/vcs/VcsProvisioningService.ts", "apps/server/src/orchestration-v2/WorktreeBranchSync.ts"]
test_command = "cargo test --locked --test workbench_git"
accept = [
  "用本地裸仓库充当远端，经服务克隆、查看状态、建分支并创建两个工作树。两个聊天同时改同一路径，逐个读取文件、分支和暂存区，确认各自变更互不覆盖。",
  "经正常接口提交并推送，独立克隆核对远端提交 ID、树和内容；从另一副本产生新提交再拉取，核对状态广播及结果。模拟非快进推送、拉取冲突和有本地修改的工作树清理，检查错误及保留下来的数据。",
  "在工作树准备或清理期间重启并重试；已有分支或目录归属清晰，无重复资源。回归第一阶段按回合恢复和分叉，核对父聊天所在工作树、分支和索引。"
]

[[items]]
id = "handoff"
name = "同一聊天跨供应商交接"
hours = [24, 48]
reference = ["apps/server/src/orchestration-v2/ProviderSwitchService.ts", "apps/server/src/orchestration-v2/ContextHandoffService.ts", "apps/server/src/orchestration-v2/testkit/ProviderSwitch.integration.test.ts"]
test_command = "cargo test --locked --test workbench_handoff"
accept = [
  "在同一聊天用 A 建立两条可核对的事实和一次工具结果，切到 B 后继续提问。核对聊天 ID、工作区和用户可见时间线连续，检查 B 实际收到的交接输入及回复，源会话仍可追溯。",
  "再从 B 切回 A，验证增量或按预算生成的摘要覆盖正确范围；旧工具副作用未重放，已发送交接只出现一次。覆盖超长历史、切换过程中仍有活动回合以及目标供应商拒绝启动的情形。",
  "交接准备和接纳之间分别断开控制器，再恢复或重试；检查新的回合归属、失败结果和恢复策略。对声明支持的供应商组合做协议验证，并至少以两个可用的真实适配器完成一次往返。"
]

[[items]]
id = "terminal_preview"
name = "用户交互终端与开发服务预览"
hours = [40, 80]
reference = ["packages/contracts/src/terminal.ts", "apps/server/src/terminal/Manager.ts", "apps/server/src/preview/Manager.ts", "apps/server/src/preview/PreviewTunnel.ts"]
test_command = "cargo test --locked --test workbench_terminal_preview"
accept = [
  "从客户端在指定工作树打开真实 PTY，输入命令并调整窗口大小；核对 shell 报告的 cwd、终端尺寸和输出。第二个客户端附着同一终端，断开后重连能补读已有输出，命令只执行一次。",
  "启动两个可辨认的本机 HTTP 开发服务，核对端口发现、预览目标和浏览器实际加载的响应。经授权隧道访问指定目标，关闭隧道后连接失效，另一个项目不受影响。",
  "分别测试 shell 退出、端口进程退出、客户端断开和 Kar 重启。核对历史、退出状态与资源释放；宿主重启后按实际进程存活状态恢复或明确报告终止。"
]

[[items]]
id = "forge"
name = "PR、Issue 与代码审阅"
hours = [56, 120]
reference = ["apps/server/src/sourceControl/builtInDrivers.ts", "apps/server/src/sourceControl/sourceControlDefinitions.ts", "apps/server/src/pullRequest/PullRequestService.ts", "apps/server/src/review/ReviewService.ts", "apps/server/src/issue/IssueService.ts"]
test_command = "cargo test --locked --test workbench_forge"
accept = [
  "按固定提交实际注册的代码托管与问题跟踪驱动列出支持操作和启用条件。逐驱动验证仓库及身份映射、权限、返回字段和拒绝结果。用至少一个可用测试仓库走完开发分支、推送、创建 PR 并关联原聊天的链路。",
  "从已有 PR 准备工作树，逐文件核对基准和头提交之间的差异，保存已审文件，重启后读回。远端更新头提交或关闭 PR 后同步状态，迟到或重复通知不覆盖较新结果。",
  "在测试项目查询 Issue，打开关联聊天并执行驱动支持的状态变更。重试创建或绑定操作时核对远端对象数；权限、限流和不确定结果均可观察。真实平台缺少凭据时保留录制或本地协议测试及补验步骤。"
]

[[items]]
id = "workflows"
name = "定时任务与持久化工作流"
hours = [48, 96]
reference = ["packages/contracts/src/scheduledTask.ts", "packages/contracts/src/workflow.ts", "apps/server/src/scheduledTasks/ScheduledTaskService.ts", "apps/server/src/workflows/WorkflowRuntime.ts"]
test_command = "cargo test --locked --test workbench_workflows"
accept = [
  "以可控时钟验证一次性、固定时间和间隔任务。覆盖服务停机错过触发点及两个执行者竞争同一触发；对照固定契约核对下次执行时间、补跑策略和实际运行数。",
  "发送有效、重复和签名不符的 Webhook，记录对应触发数；有效事件只启动一次运行，拒绝事件不产生执行副作用。",
  "执行包含脚本、agent、人工问答、等待和后续步骤的流程。在等待、人工答复和外部副作用回执前后重启；核对步骤结果、恢复位置、取消和失败重试。外部系统无法确认是否成功时保留待对账状态。"
]

[[items]]
id = "remote_access"
name = "远程设备接入、权限与访客分享"
hours = [48, 104]
reference = ["apps/server/src/auth/EnvironmentAuth.ts", "apps/server/src/auth/PairingGrantStore.ts", "apps/server/src/auth/RpcAuthorization.ts", "packages/contracts/src/guestShare.ts", "apps/server/src/guest/GuestShareService.ts"]
test_command = "cargo test --locked --test workbench_remote_access"
accept = [
  "用两个独立客户端走服务端配对、授权、重新连接和撤销流程；核对凭据归属、配对凭证的重用限制，以及未配对或已撤销设备访问项目、终端、预览和聊天时的拒绝。",
  "为指定聊天创建限时访客分享，通过受支持的远程连接实际打开。访客只能读取授权视图；提交提议后由主人接纳或驳回。断线、同一请求重试、重复接纳均不产生第二条用户消息。",
  "核对跨聊天访问的拒绝、附件归属与大小限制、过期和主动撤销后的新请求与活动订阅。服务重启后授权及撤销状态仍正确；本机回环和真实跨设备证据分别登记。"
]

[[items]]
id = "coediting"
name = "人机双写与冲突处理"
hours = [152, 312]
basis = "Kar 的人机协作编辑需求。基础样本为 UTF-8 纯文本、Markdown、.docx、.xlsx 和 .pptx。后三种格式分别通过 Kantor 的 Rust 引擎验收。"
contract = "人和 AI 的每次编辑都关联文档、基准修订、选区和操作 ID。Rust 后端按最新修订原子提交可合并的改动，向订阅者返回实际修订。无法确定合并结果时，保留当前正文和待处理的改动，并通知冲突。"
test_command = "cargo test --locked --test workbench_coediting"
accept = [
  "人和 AI 从同一修订打开五段正文。AI 改第三段，人改第五段。用同步屏障分别控制人先提交、AI 先提交和同时提交。三次最终全文都须与同一份预期文本逐字一致，磁盘及两客户端一致。再让人在文首插入一段，核对 AI 的改动仍落在原选区。样本含中文和两个文字相同的段落。",
  "用同一段测试可合并的编辑。以「上线日是周一，负责人是小李。」为原文，人将「周一」改为「周三」，AI 将「小李」改为「小林」。两种到达顺序都须自动得到「上线日是周三，负责人是小林。」。双方对同一处提出相同替换时，正文只出现一次替换，两次请求均可查到结果。",
  "用同一处的两种替换测试冲突。人和 AI 分别把同一个「周一」改成「周三」和「周五」，并交换提交顺序复测。后到的一方得到可识别的冲突，两个客户端能查看选区、基准、当前内容和待处理改动。核对磁盘保留先提交的版本，正文修订号不前进。另测一方删段、另一方改该段的情形。",
  "由用户分别选择保留当前内容、采用提议和手动给出合并文本。用当前修订提交后，两端观察到同一结果。若用户处理冲突期间正文又有更新，按新修订重新校验，保留第三次修改并在需要时再次提示。",
  "从普通文件保存 API 提交人的改动，让启用双写的原生适配器从旧版本生成 AI 修改，覆盖工具尝试整文件写回的路径。核对人的新段落仍在、下一次 AI 读取包含已接受的修改。需要时让原生程序在隔离副本生成改动，再由 Rust 后端合并。另在 AI 生成期间从外部编辑器保存文件，验证后端写回前识别磁盘的新内容。",
  "分别在编辑已提交但回执丢失、冲突已记录但用户尚未处理时重启，用同一操作 ID 重试并按游标重连。已提交的修改只生效一次，待处理的冲突及双方版本仍可取回，两个客户端和重新打开的文件内容一致。"
]

[items.kantor]
repository = "https://github.com/kense-labs/kantor"
commit = "9b780379e32d3fa4d293499f33fbc2483655567d"
boundary = "Kantor 引擎负责读取、修改及保存 Office 文档模型。Kar 负责目标定位、修订、并发合并、持久化、幂等和冲突通知。通过 Rust 服务入口在无窗口环境执行，人和 AI 共用同一提交协议。"
estimate_detail = "沿用文本双写 40–80 小时。新增引擎接入、共享回执与往返测试 24–48 小时，Word 24–48 小时，Excel 32–64 小时，PPT 32–72 小时。"
merge = "用编辑的基准修订、当前已提交修订和提议做三方比较，按下列各格式的对象及属性应用到最新版本。重复的等价修改合并一次。插入、移动或重排后须能唯一定位原目标，有歧义时返回冲突。复合操作要么整体生效，要么整体待处理。"
conflict = "返回并持久化可订阅的结构化冲突。包含冲突 ID、操作 ID、文档和目标、作者、基准与当前修订、冲突原因，以及基准值、当前值和提议值或其可读差异。通知说明具体位置，例如正文中的段落、工作表名和地址、幻灯片与对象名。当前内容保留在文件中，另一方的提议可供读取。解决时支持保留当前值、采用提议或提交手工合并值，并以解决时的最新修订复核。"
common_accept = [
  "每种格式用真实 Office 文件，从同一修订经 Kar 服务发起人和 AI 两个编辑。分别制造人先提交、AI 先提交和并发提交。成功后核对两端事件与落盘文件，以 Kantor 引擎重新打开，并用独立的 Rust ZIP/XML 断言核对目标值和未涉及内容，包括样本的样式、关系和媒体。",
  "每种格式至少制造一次冲突。核对两端收到同一冲突 ID、原因、目标和三方内容；从冲突前已落盘版本开始，文件哈希和文档修订均保持原值。对同一操作重试、服务重启并从旧游标重连，能取回同一结果。显式解决并重开文件，核对仅解决的内容生效。处理期间再提交第三次编辑，过期的解决请求须重新校验。",
  "覆盖外部程序另存回原路径和原生 AI 工具提交整份文件的情形。已有新修订时提取可定位的对象改动再合并；无法可靠定位、解析或无损写回时保留原文件，返回明确原因并保留候选改动。"
]

[items.kantor.word]
format = ".docx"
engine = "docs_engine::Document"
source = "crates/docs_engine/src/document.rs"
unit = "正文段落；段内编辑携带基准文本范围，涉及格式时携带对应属性。"
merge = "不同段落独立合并。同段互不重叠的文字替换、互不影响的文字与格式修改可合并。竞争替换同一范围、删除与编辑同一段、段落拆分后选区归属不明时提示冲突。"
test_command = "cargo test --locked --test workbench_coediting word::"
accept = [
  "在含两个同文段落及加粗文字的样本中，让人改第三段、AI 改第五段，再在文首插段。按原目标恢复两处修改，核对同文的另一段、未选文字及加粗属性。",
  "在同段分别把「周一」改为「周三」、把「小李」改为「小林」，核对两处都保留。再让双方把同一处「周一」分别改成「周三」和「周五」，以及一方删段、另一方改段。冲突回执须能辨认段落、原选区和两种提议。"
]

[items.kantor.excel]
format = ".xlsx"
engine = "sheets_engine::Workbook"
source = "crates/sheets_engine/src/lib.rs"
unit = "工作表中的逻辑单元格；输入值与公式共用内容字段，格式属性单独比较。"
merge = "不同单元格独立合并，依据合并后的工作簿重算受影响的公式。同一格的内容与独立格式修改可合并。对同一格写不同值、写入值与公式相竞争或删除目标行列后仍要写入时提示冲突。插行或工作表重排后要映射回原单元格。"
test_command = "cargo test --locked --test workbench_coediting excel::"
accept = [
  "在「预算」表把 B3 从 10 改到 12，同时让 AI 把 D3 公式改为 =B3*3。重开后核对输入值、公式与计算结果 36，另一张表的 B3 保持原值。再测试先在上方插行，确认改动随逻辑单元格移动，公式引用正确。",
  "一方改 B3 的值，另一方只设置 B3 的填充色，两者均生效。两方分别写不同值或分别写公式与常量时，返回含工作表、单元格地址及双方原始输入的冲突。即使显示值相同，也要区分公式与常量。"
]

[items.kantor.slides]
format = ".pptx"
engine = "slides_engine::Presentation"
source = "crates/slides_engine/src/presentation.rs"
unit = "幻灯片中的对象；编辑携带基准对象身份和受影响的属性，分开比较文字、位置、尺寸及样式。"
merge = "不同对象独立合并。同一对象的文字修改与独立的位置修改可合并。两方给同一属性写入不同值、删除对象与编辑对象相竞争，或重排后不能唯一识别对象时提示冲突。"
test_command = "cargo test --locked --test workbench_coediting slides::"
accept = [
  "在含标题框、两个同名形状和一张图片的样本中，人改标题，AI 移动其中一个形状。分别改变幻灯片顺序及对象层级后重放编辑，核对仍命中原对象；重开检查文字、坐标、图片及关系。",
  "对同一文本框一方改文字、另一方仅改横坐标，核对两项同时保留。再让两方给横坐标写不同值，以及一方删框、另一方改框。回执应指出幻灯片、对象及冲突属性，另一形状不受影响。"
]

[final_acceptance]
scenario = "在隔离测试仓库从 Issue 或 PR 建独立工作树，两个客户端打开同一聊天，由两个供应商接力。通过 PTY 运行服务，经预览确认输出，推送提交并核对 PR；用 Webhook 启动工作流，访客提议由主人接纳。在服务重启后检查各对象身份、权限、历史、执行次数及对远端的实际影响。"
regression = ["cargo fmt --all -- --check", "cargo clippy --locked --all-targets -- -D warnings", "cargo test --locked"]
coediting_scenario = "在上述工作树中由人和 AI 并发修改同一份 Markdown。将双方兼容的改动提交到 PR，核对远端文件内容。再制造冲突并重启 Kar，核对待处理提议可取回，未经解决的提议未写入工作区或提交。"
office_scenario = "从同一工作区依次运行 Word、Excel 和 PPT 的无界面双写场景。每种格式提交一次兼容修改，制造并显式解决一次冲突，重启 Kar 后从磁盘重开文件。按格式分别记录实际命令、执行用例数、修订与冲突回执和文件断言结果。"
done_when = "八组用例按实际适用的驱动和平台逐项出具证据，完成跨模块场景并回归第一阶段。可实现、可验证的缺口全部解决，供应商限制与缺环境实测分别列出。"
